apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace = "com.soulscript.app"
    
    // Sync with Global Truth
    compileSdk = rootProject.ext.compileSdk
    compileSdkVersion = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId = "com.soulscript.app"
        minSdk = rootProject.ext.minSdk
        minSdkVersion = rootProject.ext.minSdkVersion
        targetSdk = rootProject.ext.targetSdk
        targetSdkVersion = rootProject.ext.targetSdkVersion
        
        versionCode = 1
        versionName = "1.0"
        
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        
        aaptOptions {
             ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }
    
    kotlinOptions {
        jvmTarget = "21"
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    
    // Sync Versions with Global Truth
    implementation "androidx.appcompat:appcompat:${rootProject.ext.androidxAppCompatVersion}"
    implementation "androidx.coordinatorlayout:coordinatorlayout:${rootProject.ext.androidxCoordinatorLayoutVersion}"
    implementation "androidx.core:core-splashscreen:${rootProject.ext.coreSplashScreenVersion}"
    
    // Material Engine
    implementation "com.google.android.material:material:1.11.0"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"

    // Capacitor Native Bridge
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

apply from: 'capacitor.build.gradle'
